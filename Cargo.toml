[package]
name = "avr_tc1_embassy_time"
version = "0.4.0"
edition = "2024"
author = "djdisodo@gmail.com"
license = "MIT"
repository = "https://github.com/djdisodo/avr_tc0_embassy_time"
description = "embassy_time driver for avr"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
static_assertions = "1.1.0"
embassy-time-driver = "0.2"
avr-device = { version = "^0.8", features = ["rt"] }
futures-util = { version = "0.3.32", default-features = false, features = ["portable-atomic"] }
vcell = { version = "0.1.3", optional = true }
env_int = "0.2.0"

[dependencies.avr-hal-generic]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"

[dependencies.atmega-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"

[features]
default = ["prescalar64", "queue"]
stack_addr = ["dep:vcell"]
queue = []

# prescalar
prescalar1 = []
prescalar8 = []
prescalar64 = []
prescalar256 = []
prescalar1024 = []

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
